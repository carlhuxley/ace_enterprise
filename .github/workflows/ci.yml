name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        # Report issues but don't fail build (known technical debt)
        # Remove --exit-zero once baseline is clean
        run: ruff check src/ mcp_server/ --output-format=github || true

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install types-PyYAML types-toml

      - name: Run mypy
        # Report issues but don't fail build (known technical debt)
        # Remove || true once baseline is clean
        run: mypy src/ mcp_server/ --ignore-missing-imports || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # simulation extra (pybullet) is needed on the runner's own Python
        # env, not just inside the sim-harness container -- test_simulation_
        # podman_runner.py's "bare vs containerized" comparison test runs
        # SimulationOracle directly on the host to compare against the
        # containerized result.
        run: pip install -e ".[dev,simulation]"

      - name: Set up Node.js
        # Real mermaid.js parser for test_mermaid_validity.py -- catches
        # ungrammatical generated diagrams (e.g. the activate/deactivate
        # mismatch that silently broke docs/SYSTEM_ARCHITECTURE.md's
        # rendering on GitHub) before they ship, instead of after.
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install mermaid-check dependencies
        run: cd tools/mermaid_check && npm install

      - name: Build Podman harness images
        # ubuntu-latest ships podman pre-installed, so skip_no_podman-style
        # checks (shutil.which("podman")) never skip the podman-backed
        # integration tests here -- but without these images built first,
        # `podman run localhost/ace-*-harness:latest` tries to *pull* that
        # tag from a registry at "localhost" and fails (dial tcp connection
        # refused), which is what was actually happening before this step
        # existed (confirmed live via a diagnostic error-surfacing commit).
        # Containerfile.simulation COPYs src/agents/simulation_*.py with
        # repo-relative paths, so it alone needs the repo root as context,
        # not docker/harness/ (see build_simulation_image()'s docstring).
        run: |
          podman build -f docker/harness/Containerfile -t localhost/ace-harness:latest docker/harness
          podman build -f docker/harness/Containerfile.go -t localhost/ace-go-harness:latest docker/harness
          podman build -f docker/harness/Containerfile.ts -t localhost/ace-ts-harness:latest docker/harness
          podman build -f docker/harness/Containerfile.simulation -t localhost/ace-sim-harness:latest .

      - name: Run tests
        run: pytest tests/ -v --tb=short
