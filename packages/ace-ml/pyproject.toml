[project]
name = "ace-ml"
version = "0.1.0"
description = "ACE ML: MLflow integration for experiment tracking and knowledge capture"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "ace-storage>=0.1.0",
    "ace-playbook>=0.1.0",
    "mlflow>=2.8.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
]

[tool.uv.sources]
ace-storage = { workspace = true }
ace-playbook = { workspace = true }

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
