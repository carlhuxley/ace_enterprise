[project]
name = "ace-core"
version = "0.1.0"
description = "ACE core: configuration, LLM client, and shared utilities"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=2.2.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
