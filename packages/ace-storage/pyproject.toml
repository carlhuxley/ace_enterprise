[project]
name = "ace-storage"
version = "0.1.0"
description = "ACE storage: database models, repository, and experiment logging"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "ace-core>=0.1.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.3",
    "alembic>=1.13.0",
]

[tool.uv.sources]
ace-core = { workspace = true }

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
