[project]
name = "ace-enterprise"
version = "0.1.0"
description = "ACE Enterprise - Institutional Knowledge Development Middleware"
authors = [
    {name = "Carl Huxley", email = "carl@carlhuxley.com"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

dependencies = [
    # Core TDD/Playbook functionality
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    # Database and vector storage
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.3",
    "alembic>=1.13.0",
    # Embeddings for semantic search
    "sentence-transformers>=2.2.0",
    "bandit>=1.9.4",
    # API services (src/main.py, src/audit/api.py, src/audit/collector.py)
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "prometheus-client>=0.19.0",
    # Bayesian confidence estimation (src/broker/bayesian.py)
    "scipy>=1.11.0",
]

[project.scripts]
ace = "src.cli.main:main"

[project.optional-dependencies]
ml = [
    # MLflow integration for experiment knowledge capture
    "mlflow>=2.8.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
]

simulation = [
    # PegInHoleOracle (src/agents/simulation_oracle.py) -- headless physics
    # test oracle for SimulationPod, proving the TDD harness is domain-agnostic.
    "pybullet>=3.2.5",
]

dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",

    # Code quality
    "ruff>=0.1.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "mcp_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=src --cov-report=html --cov-report=term-missing"
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "pgvector.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "litellm.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",

    # Code quality -- also declared under [project.optional-dependencies].dev
    # for CI's pip-based install; duplicated here so `uv sync` (the local
    # dev workflow) installs them too instead of only pulling in pytest.
    "ruff>=0.1.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[tool.uv.workspace]
members = [
    "packages/ace-core",
    "packages/ace-storage",
    "packages/ace-audit",
    "packages/ace-playbook",
    "packages/ace-ensemble",
    "packages/ace-tdd",
    "packages/ace-contracts",
    "packages/ace-ml",
    "packages/ace-mcp",
]
